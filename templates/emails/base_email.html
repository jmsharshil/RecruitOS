<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ org_name }} — RecruitSmart{% endblock %}</title>
  <style>
    /* Reset */
    body,
    table,
    td,
    p,
    a {
      margin: 0;
      padding: 0;
      border: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      line-height: 1.6;
    }

    .wrapper {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .body p {
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* CTA Button */
    .btn-wrapper {
      margin: 20px 0;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: {{ primary_color|default:"#2563eb" }};
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #eeeeee;
      margin: 20px 0;
    }

    .info-box {
      background: #f9f9f9;
      border-left: 4px solid {{ primary_color|default:"#2563eb" }};
      padding: 15px;
      margin-bottom: 20px;
    }

    .info-box p {
      margin: 0;
      font-size: 14px;
    }

    .footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #eeeeee;
    }

    .footer p {
      font-size: 12px;
      color: #888888;
      line-height: 1.5;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <!-- Content block -->
    <div class="body">
      {% block content %}{% endblock %}
    </div>
    </div>
  </div>
</body>

</html>
